name: Deploy UI to GitHub Pages

# Triggered by a green ci run on main or test. Pages holds ONE artifact, so every run builds both
# sites, each branch at the head SHA of its LATEST GREEN ci push run (looked up at run time, not
# taken from the trigger): main -> /, test -> /test/. Nothing untested is published, and a ci run
# that finishes late cannot roll the site back. Each branch is built as-is, wasm included (rust/pkg
# is gitignored, and rust/src/generated.rs follows each branch's data). A main with no green run
# fails the deploy; a test with no branch or no green run means no /test/.
# VITE_SERVER=test only labels the test build and namespaces its storage.
# workflow_run only fires from main's copy of this file, with github.ref_name always 'main'.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, test]
  workflow_dispatch:

# Permissions required by actions/deploy-pages.
permissions:
  contents: read
  actions: read # gh run list: each branch's latest green ci run
  pages: write
  id-token: write

# One deployment at a time; a queued run replaces an older queued one. Each run looks up both green
# SHAs when it starts, after the previous run has finished, so the survivor is always current.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run fires on any conclusion and for pull_request runs too (a PR's head branch can be
    # named main or test), so deploy only a successful push run from this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # Runs are listed newest first, so `.[0]` of the successful push runs is the latest green commit.
      - name: Latest green ci commit of each branch
        id: green
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          green() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$1" --event push \
              --status success --limit 1 --json headSha --jq '.[0].headSha // empty'
          }
          main=$(green main)
          test=$(green test)
          [ -n "$main" ] || { echo "::error::main has no green ci push run; not deploying"; exit 1; }
          [ -n "$test" ] || echo "::notice::test has no branch or no green ci push run; deploying / only"
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "test=$test" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.green.outputs.main }}
          path: live

      - name: Checkout test
        if: steps.green.outputs.test != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.green.outputs.test }}
          path: test

      # A workflow_dispatch run from any other ref executes that ref's copy of this file; refuse to
      # deploy live from a copy that differs from main's (compared at the running workflow's own
      # commit, not the head). Under workflow_run ref_name is always main, so this never runs there.
      - name: Workflow must match main's
        if: github.ref_name != 'main'
        run: |
          git -C live fetch -q --depth=1 origin "$GITHUB_WORKFLOW_SHA"
          git -C live diff --exit-code HEAD FETCH_HEAD -- .github/workflows/deploy.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '*/ui/package-lock.json'

      # The wasm twin (rust/pkg is gitignored): the in-browser enhancement costing and the
      # experimental wasm engine need it, and the UI build silently omits it when absent.
      - uses: dtolnay/rust-toolchain@1.92.0
        with: { targets: wasm32-unknown-unknown }

      - uses: Swatinem/rust-cache@v2
        with:
          # A missing test/rust (no test branch) is logged and skipped by rust-cache, not an error.
          workspaces: |
            live/rust -> target
            test/rust -> target

      - uses: taiki-e/install-action@v2
        with: { tool: wasm-pack@0.15.0 }

      # The .wasm must be emitted AND referenced by a bundled chunk (the glue's new URL(...)).
      - name: Build / (main)
        working-directory: live
        run: |
          ./build.sh wasm
          cd ui && npm ci && npm run build
          ls dist/assets/csim_twin_bg-*.wasm && grep -q 'csim_twin_bg-' dist/assets/*.js

      # A broken test branch must not block a live deploy: from main it only warns (and / ships
      # without /test/); from test it fails the run.
      - name: Build /test/ (test)
        id: build_test
        if: steps.green.outputs.test != ''
        continue-on-error: ${{ (github.event.workflow_run.head_branch || github.ref_name) != 'test' }}
        working-directory: test
        env: { VITE_SERVER: test }
        run: |
          ./build.sh wasm
          cd ui && npm ci && npm run build
          ls dist/assets/csim_twin_bg-*.wasm && grep -q 'csim_twin_bg-' dist/assets/*.js || exit 1
          # A test head without the storage namespace (ui/src/utils/serverStorage.js) would share live's
          # localStorage on this origin: never publish it.
          grep -q 'test::' dist/assets/*.js || { echo "::error::test build lacks the test:: storage namespace"; exit 1; }

      - name: Assemble one site
        env:
          TEST_EXISTS: ${{ steps.green.outputs.test != '' }}
          TEST_OK: ${{ steps.build_test.outcome == 'success' }}
        run: |
          mkdir site && cp -R live/ui/dist/. site/
          if [ "$TEST_OK" = true ]; then
            [ ! -e site/test ] || { echo "::error::live build already has a test/ path"; exit 1; }
            cp -R test/ui/dist site/test
          elif [ "$TEST_EXISTS" = true ]; then
            echo "::warning::test build failed; this deploy REMOVES /test/ until it is fixed"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
