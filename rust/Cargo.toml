[package]
name = "csim-twin"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [".", "crates/mwi-econ"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "csim-native"
path = "src/bin/csim-native.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.106"
js-sys = "=0.3.83"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
